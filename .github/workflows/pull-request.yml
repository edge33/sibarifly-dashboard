name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
          require-lockfile: true

      # Root scripts run application commands with apps/api as their cwd.
      - name: Generate Prisma Client
        run: pnpm prisma-generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome check
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build UI
        run: pnpm build:web
        env:
          VITE_API_URL: /api
