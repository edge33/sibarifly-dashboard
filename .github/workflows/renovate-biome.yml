name: Migrate and format Biome updates

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: renovate-biome-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/biomejs-biome-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # A PAT makes the resulting commit trigger the normal PR checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Detect Biome dependency update
        id: biome
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const base = JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:package.json`], { encoding: 'utf8' }));
          const head = JSON.parse(readFileSync('package.json', 'utf8'));
          const changed = base.devDependencies['@biomejs/biome'] !== head.devDependencies['@biomejs/biome'];
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        if: steps.biome.outputs.changed == 'true'
        with:
          cache: true
          require-lockfile: true

      - name: Migrate Biome configuration and format project
        if: steps.biome.outputs.changed == 'true'
        run: |
          pnpm biome migrate --write
          pnpm format

      - name: Commit changes to the Renovate PR
        if: steps.biome.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add --update
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: migrate Biome configuration and format project"
          git push origin "HEAD:$HEAD_REF"
