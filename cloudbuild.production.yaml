# Production trigger: stable vMAJOR.MINOR.PATCH tags only.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west8
  _SERVICE: sibarifly-dashboard-main
steps:
  - id: build
    name: gcr.io/cloud-builders/docker@sha256:91eaff0806a70dc0b3c853191a2da9995b2aa88d9b24196182344a4cef633603
    args:
      - build
      - --no-cache
      - --build-arg
      - WEB_APP_BRANCH=main
      - --build-arg
      - VITE_API_URL=/api
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - --label
      - org.opencontainers.image.version=$TAG_NAME
      - -t
      - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
      - .

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:91eaff0806a70dc0b3c853191a2da9995b2aa88d9b24196182344a4cef633603
    args: [push, "gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME"]

  - id: migrate
    name: node:26.13.0-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072
    entrypoint: sh
    secretEnv: [DATABASE_URL, DIRECT_URL]
    args:
      - -ec
      - |
        npm install -g pnpm@12.18.0
        pnpm install --frozen-lockfile
        pnpm prisma migrate deploy

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim@sha256:bcf0e21d6d66c692c78bff2ca92a459eefbf822c5a98a4de4e3287540005fe04
    entrypoint: bash
    env:
      - IMAGE=gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
      - SERVICE=$_SERVICE
      - REGION=$_REGION
    args:
      - -ec
      - |
        digest=$(gcloud container images describe "$$IMAGE" --format='value(image_summary.digest)')
        [[ "$$digest" =~ ^sha256:[a-f0-9]{64}$$ ]]
        gcloud run deploy "$$SERVICE" --image="$${IMAGE%:*}@$$digest" \
          --region="$$REGION" --allow-unauthenticated --quiet
images:
  - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_URL_SECRET}/versions/latest
      env: DIRECT_URL
