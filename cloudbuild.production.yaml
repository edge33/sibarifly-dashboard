# Production trigger: stable vMAJOR.MINOR.PATCH tags only.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west8
  _SERVICE: sibarifly-dashboard-main
steps:
  - id: checks
    name: node:26.13.1-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    entrypoint: sh
    args:
      - -ec
      - |
        npm install -g pnpm@12.21.0
        pnpm install --frozen-lockfile
        pnpm prisma-generate
        pnpm lint
        pnpm typecheck
        pnpm test
        VITE_API_URL=/api pnpm build:web

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args:
      - build
      - --no-cache
      - --build-arg
      - VITE_API_URL=/api
      - --label
      - org.opencontainers.image.revision=$COMMIT_SHA
      - --label
      - org.opencontainers.image.version=$TAG_NAME
      - -t
      - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
      - .

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:2d89b48c704ddcc4a199dd1cc70c21813fb675227600f19cb77e5bbf368012bc
    args: [push, "gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME"]

  - id: migrate
    name: node:26.13.1-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    dir: apps/api
    entrypoint: sh
    secretEnv: [DATABASE_URL, DIRECT_URL]
    args: [-ec, "./node_modules/.bin/prisma migrate deploy"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim@sha256:934bb306bc5a5e103baaf1f95d39d2ccc7e8bf0c778f6450ad7574783203df3b
    entrypoint: bash
    env:
      - IMAGE=gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
      - SERVICE=$_SERVICE
      - REGION=$_REGION
    args:
      - -ec
      - |
        digest=$(gcloud container images describe "$$IMAGE" --format='value(image_summary.digest)')
        [[ "$$digest" =~ ^sha256:[a-f0-9]{64}$$ ]]
        gcloud run deploy "$$SERVICE" --image="$${IMAGE%:*}@$$digest" \
          --region="$$REGION" --allow-unauthenticated --quiet
images:
  - gcr.io/$PROJECT_ID/github.com/edge33/sibarifly-dashboard:$TAG_NAME
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/${_DIRECT_URL_SECRET}/versions/latest
      env: DIRECT_URL
